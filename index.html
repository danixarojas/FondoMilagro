<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d6a55">
<title>Fondo Milagro Digital</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Diseño: cabecera + pestañas arriba, contenido en tarjetas; verde profundo como acento, semáforo solo para estados. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#15231d; --muted:#5b6b64; --line:#dde4de;
  --accent:#0d6a55; --accent-soft:#dff1ea; --accent-ink:#ffffff;
  --good:#1a7f4b; --good-bg:#dff3e7; --warn:#8a5a00; --warn-bg:#fdf0cf; --bad:#a82a2a; --bad-bg:#fbe3e1;
  --shadow:0 1px 2px rgba(20,35,29,.06),0 4px 16px rgba(20,35,29,.05);
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a16; --surface:#16251f; --ink:#e7f0eb; --muted:#9bb0a6; --line:#26382f;
    --accent:#4cc9a3; --accent-soft:#16372d; --accent-ink:#06261c;
    --good:#5fd394; --good-bg:#173a28; --warn:#f0c15a; --warn-bg:#3b2e0f; --bad:#ff8f87; --bad-bg:#43201e;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a16; --surface:#16251f; --ink:#e7f0eb; --muted:#9bb0a6; --line:#26382f;
  --accent:#4cc9a3; --accent-soft:#16372d; --accent-ink:#06261c;
  --good:#5fd394; --good-bg:#173a28; --warn:#f0c15a; --warn-bg:#3b2e0f; --bad:#ff8f87; --bad-bg:#43201e;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px} h3{font-size:16px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:14px 0}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--display);font-size:20px}
.brand span{color:var(--muted);font-size:13px}
.who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
select,input,textarea,button{font:inherit}
select,input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],textarea{
  background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.who select{width:auto}
textarea{resize:vertical;min-height:64px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current=page]{color:var(--accent);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-size:12px;text-align:center}
.notice{background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px}
.notice .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center;padding-top:8px;padding-bottom:8px}
main{padding:20px 0 48px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.card header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi strong{display:block;font-family:var(--display);font-size:26px;margin-top:2px}
.kpi em{font-style:normal;color:var(--muted);font-size:12px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rowbar{display:grid;grid-template-columns:130px 1fr 100px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.rowbar span:last-child{text-align:right}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.55;cursor:wait}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);min-width:160px}
.muted{color:var(--muted)}
.sm{font-size:13px}
.loan{display:flex;flex-direction:column;gap:12px}
.loan-top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.stats{display:flex;flex-wrap:wrap;gap:6px 28px}
.stats div small{display:block;color:var(--muted);font-size:12px}
.stats div b{font-variant-numeric:tabular-nums}
.empty{padding:20px;text-align:center;color:var(--muted)}
#modal{position:fixed;inset:0;background:rgba(10,20,15,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.mbox{background:var(--surface);color:var(--ink);border-radius:14px;max-width:520px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.mbody{padding:16px;display:flex;flex-direction:column;gap:12px}
.mbody label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.mbody label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.mbody label.chk input{width:auto}
.icon{background:none;border:0;color:var(--muted);font-size:24px;line-height:1;cursor:pointer}
.err{color:var(--bad);font-size:13px;margin:0}
.preview{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.evimg{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.lock{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px}
.printhead{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw;font-size:14px}
footer.foot{color:var(--muted);font-size:12px;text-align:center;padding:0 16px 32px}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s}}
@media (max-width:520px){.rowbar{grid-template-columns:90px 1fr 84px}}
@media print{
  body{background:#fff;color:#000}
  header.top,.notice,footer.foot,.no-print,#modal,#toast,.actions,.btn{display:none!important}
  .printhead{display:block;margin-bottom:12px}
  .card{box-shadow:none;border:1px solid #bbb;break-inside:avoid}
  .wrap{max-width:none;padding:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><b id="fundName">Fondo Milagro</b><span id="fundSub"></span></div>
      <div class="who" id="demoWho">
        <label for="userSel">Ver como</label>
        <select id="userSel" data-bind="userId"></select>
        <button class="btn sm ghost" type="button" data-act="edit-name">Mi nombre</button>
      </div>
      <div class="who" id="prodWho" hidden>
        <span id="meName"></span>
        <button class="btn sm ghost" type="button" data-act="edit-name">Mi nombre</button>
        <button class="btn sm ghost" type="button" data-act="change-pass">Cambiar contraseña</button>
        <button class="btn sm ghost" type="button" data-act="logout">Salir</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  </div>
</header>
<div class="notice" id="demoNotice"><div class="wrap">
  <span>Modo demostración: datos de ejemplo guardados solo en este navegador.</span>
  <button class="btn sm ghost" data-act="reset" type="button">Restablecer demo</button>
</div></div>

<div class="wrap" id="loginBox" hidden>
  <div class="card" style="max-width:420px;margin:48px auto">
    <header><h2>Ingresar a la Fondo Milagro</h2></header>
    <form data-form="login" style="display:grid;gap:12px">
      <label class="sm muted">Correo<input type="email" id="lg-email" autocomplete="username"></label>
      <label class="sm muted">Contraseña<input type="password" id="lg-pass" autocomplete="current-password"></label>
      <p class="err" id="ferr" role="alert"></p>
      <button class="btn" type="submit">Entrar</button>
      <p class="muted sm" style="margin:0">¿No tienes acceso? Pídele al administrador que te registre.</p>
    </form>
  </div>
</div>
<div class="wrap" id="msgBox" hidden><div class="card" style="max-width:520px;margin:48px auto"><h2>Atención</h2><p id="msgText"></p></div></div>

<div class="wrap" id="appBox"><main id="view" tabindex="-1"></main></div>
<footer class="foot">Fondo Milagro Digital · los comprobantes se guardan de forma privada y no se pueden borrar.</footer>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   UTILIDADES
   ===================================================================== */
var $ = function(s, r){ return (r||document).querySelector(s); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var cop = new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
var fmt = function(n){ return cop.format(Math.round(n||0)); };
var uid = function(){ return Math.random().toString(36).slice(2,9)+Math.random().toString(36).slice(2,6); };
var pad = function(n){ return String(n).padStart(2,'0'); };
var iso = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
var parseISO = function(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); };
var todayISO = function(){ return iso(new Date()); };
var addDays = function(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; };
var daysBetween = function(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); };
function fdate(s){ if(!s) return '—'; return parseISO(String(s).slice(0,10)).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}); }
var sum = function(arr, f){ return arr.reduce(function(a,x){ return a+f(x); },0); };
var pctTxt = function(r){ return (r*100).toFixed(1).replace('.0','')+'%'; };
var byId = function(arr,id){ return arr.filter(function(x){ return x.id===id; })[0]; };
var DUP = 'Este comprobante ya fue usado en otro pago. Sube el comprobante correcto.';

/* =====================================================================
   CONFIGURACIÓN: modo demo (sin claves) o modo real (con Supabase)
   ===================================================================== */
var CFG = window.Fondo Milagro_CONFIG || {};
var PROD = !!(CFG.url && CFG.anonKey);
var sb = null;
// Limpia la URL: deja solo https://xxxx.supabase.co (sin "/" final, sin /rest/v1 ni espacios)
var CLEAN_URL = CFG.url || '';
try{ CLEAN_URL = new URL(String(CFG.url).trim()).origin; }catch(e){ CLEAN_URL = String(CFG.url||'').trim().replace(/\/+$/,''); }
var CLEAN_KEY = String(CFG.anonKey||'').trim();
if (PROD && window.supabase) sb = window.supabase.createClient(CLEAN_URL, CLEAN_KEY);

var S = {fund:null, members:[], contributions:[], loans:[], payments:[], log:[], snapshot:null, mine:null, profiles:[]};
var ME = null;
var ui = {tab:'resumen', userId:'m1', cMember:'todos', cStatus:'todos', stMember:null};

/* =====================================================================
   REGLAS DE NEGOCIO (iguales en demo y real; en real la base las vuelve a validar)
   ===================================================================== */
var isAdmin = function(){ return !!ME && ME.role==='admin'; };
var isStaff = function(){ return !!ME && (ME.role==='admin'||ME.role==='veedor'); };
var member = function(id){ return byId(S.members,id); };
var mname = function(id){ var m=member(id); return m?m.name:'—'; };
var amountFor = function(mod){ return mod==='quincenal'?S.fund.biweeklyAmt:S.fund.monthlyAmt; };
var paymentsOf = function(id){ return S.payments.filter(function(p){ return p.loanId===id; }); };
function loanBalance(l){ return l.amount - sum(paymentsOf(l.id).filter(function(p){ return p.status==='aprobado'; }), function(p){ return p.capital; }); }
function feeNow(c){
  var f=S.fund; if(!(f.lateFee>0)) return 0;
  return todayISO() > iso(addDays(parseISO(c.due), f.graceDays)) ? f.lateFee : 0;
}
function isLate(c){ return (c.status==='pendiente'||c.status==='rechazado') && c.due<todayISO(); }
function fundEnd(){ var p=parseISO(S.fund.startDate); return iso(new Date(p.getFullYear(),p.getMonth()+S.fund.months,0)); }
function monthsElapsed(){
  var s=parseISO(S.fund.startDate);
  return Math.max(0, Math.min(S.fund.months, (new Date()-s)/(1000*60*60*24*30.4375)));
}
function loanOverdue(l){
  if(l.status!=='activo'||!l.approvedAt) return false;
  var a=parseISO(l.approvedAt); var due=new Date(a.getFullYear(),a.getMonth()+l.term,a.getDate());
  return iso(due)<todayISO() && loanBalance(l)>0;
}
function totals(){
  var contrib=sum(S.contributions.filter(function(c){ return c.status==='aprobado'; }), function(c){ return c.amount; });
  var fees=sum(S.contributions.filter(function(c){ return c.status==='aprobado'; }), function(c){ return c.fee||0; });
  var ok=S.payments.filter(function(p){ return p.status==='aprobado'; });
  var interest=sum(ok,function(p){ return p.interest; });
  var capRet=sum(ok,function(p){ return p.capital; });
  var disbursed=sum(S.loans.filter(function(l){ return l.status==='activo'||l.status==='pagado'; }), function(l){ return l.amount; });
  var cash=contrib+fees+interest+capRet-disbursed;
  var reserve=Math.round(S.fund.reservePct*contrib);
  return {contrib:contrib, fees:fees, interest:interest, capRet:capRet, disbursed:disbursed, onLoan:disbursed-capRet,
          cash:cash, reserve:reserve, lendable:Math.max(0,cash-reserve)};
}
function weight(c){
  if(S.fund.interestMode==='tiempo') return c.amount*(daysBetween(c.due, fundEnd())+1);
  return c.amount;
}
function settlementLive(){
  var t=totals(), el=Math.max(0.5, monthsElapsed()), pool=t.interest+t.fees;
  var act=S.members.filter(function(m){ return m.active; });
  var mine=function(m){ return S.contributions.filter(function(c){ return c.memberId===m.id; }); };
  var W=function(m){ return sum(mine(m).filter(function(c){ return c.status==='aprobado'; }), weight); };
  var WE=function(m){ return sum(mine(m), weight); };
  var tw=sum(act,W), twe=sum(act,WE), projPool=pool/el*S.fund.months;
  return act.map(function(m){
    var c=sum(mine(m).filter(function(x){ return x.status==='aprobado'; }), function(x){ return x.amount; });
    var exp=sum(mine(m), function(x){ return x.amount; });
    var gain=tw?pool*W(m)/tw:0;
    var debt=sum(S.loans.filter(function(l){ return l.memberId===m.id&&l.status==='activo'; }), loanBalance);
    return {id:m.id, name:m.name, c:c, share:t.contrib?c/t.contrib:0, gain:gain, debt:debt, net:c+gain-debt, proj:exp+(twe?projPool*WE(m)/twe:0)};
  });
}
function settlement(){
  if(S.fund.closed && S.snapshot){
    return S.snapshot.map(function(r){ return {id:r.fund_member_id, name:r.full_name, c:r.saved, share:Number(r.share), gain:Number(r.profit_share), debt:r.loan_debt, net:Number(r.net), proj:null}; });
  }
  return settlementLive();
}
function pendingReview(){
  return S.contributions.filter(function(c){ return c.status==='revision'; }).length + S.payments.filter(function(p){ return p.status==='revision'; }).length;
}

/* =====================================================================
   COMPROBANTES: compresión, huella SHA-256 y lectura
   ===================================================================== */
async function sha256(buf){
  if(!(window.crypto && crypto.subtle)) return null;
  var d=await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(d)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}
function blobToDataURL(b){
  return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(r.result); }; r.onerror=function(){ rej(new Error('No se pudo leer el archivo.')); }; r.readAsDataURL(b); });
}
async function prepareEvidence(file){
  if(!file) throw new Error('Adjunta el comprobante de la consignación.');
  var hash=await sha256(await file.arrayBuffer());
  if(file.type==='application/pdf'){
    if(file.size>(PROD?1500000:600000)) throw new Error('El PDF es muy pesado. Sube una foto del comprobante o un PDF más liviano.');
    return {blob:file, type:file.type, name:file.name, ext:'pdf', hash:hash};
  }
  if(file.type.indexOf('image/')!==0) throw new Error('Sube una imagen (JPG o PNG) o un PDF.');
  var bmp; try{ bmp=await createImageBitmap(file); }catch(e){ throw new Error('No se pudo leer la imagen.'); }
  var s=Math.min(1, 900/Math.max(bmp.width,bmp.height)), c=document.createElement('canvas');
  c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  var blob=await new Promise(function(res){ c.toBlob(res,'image/jpeg',0.72); });
  if(!blob) throw new Error('No se pudo procesar la imagen.');
  return {blob:blob, type:'image/jpeg', name:file.name, ext:'jpg', hash:hash};
}

/* =====================================================================
   CAPA DE DATOS · MODO DEMO (todo en el navegador)
   ===================================================================== */
var KEY='Fondo Milagro_v2_demo';
function saveDemo(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function loadDemo(){ try{ var r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }

function schedule(modality, startISO, months){
  var p=parseISO(startISO), out=[];
  for(var i=0;i<months;i++){
    var y=p.getFullYear(), m=p.getMonth()+i;
    if(modality==='quincenal'){ out.push(iso(new Date(y,m,15))); }
    out.push(iso(new Date(y,m+1,0)));
  }
  return out;
}
function genContribs(m){
  var amt=amountFor(m.modality);
  return schedule(m.modality, S.fund.startDate, S.fund.months).map(function(d,i){
    return {id:uid(), memberId:m.id, n:i+1, due:d, amount:amt, fee:0, status:'pendiente', evidence:null, note:'', adminNote:'', paidAt:null};
  });
}
function receipt(label){
  var svg="<svg xmlns='http://www.w3.org/2000/svg' width='320' height='260'><rect width='100%' height='100%' fill='#f7f5ef'/><text x='20' y='40' font-family='monospace' font-size='16' fill='#222'>COMPROBANTE DE EJEMPLO</text><text x='20' y='80' font-family='monospace' font-size='13' fill='#444'>"+label+"</text><line x1='20' y1='100' x2='300' y2='100' stroke='#999'/><text x='20' y='140' font-family='monospace' font-size='13' fill='#444'>Transferencia exitosa</text></svg>";
  return {name:'comprobante-demo.svg', type:'image/svg+xml', data:'data:image/svg+xml;utf8,'+encodeURIComponent(svg), hash:'demo-'+uid()};
}
function seedDemo(){
  var now=new Date(), start=iso(new Date(now.getFullYear(), now.getMonth()-2, 1));
  S={
    fund:{id:'f1', name:'Fondo Milagro Amigos 14', startDate:start, months:14, rate:0.03, monthlyAmt:100000, biweeklyAmt:50000,

function hashUsed(h, except){

  var inC=S.contributions.some(function(c){ return c.evidence&&c.evidence.hash===h&&c.status!=='rechazado'&&ex.indexOf(c.id)<0; });
  var inP=S.payments.some(function(p){ return p.evidence&&p.evidence.hash===h&&p.status!=='rechazado'; });
  return inC||inP;
}

async function fetchAll(build){

  for(;;){
    var rows=must(await build().range(from, from+step-1));

  return out;
}

function render(){
  if(!ME){ return; }
  var staff=isStaff(), admin=isAdmin();
  $('#fundName').textContent=S.fund?S.fund.name:'Fondo Milagro Digital';
  $('#fundSub').textContent=S.fund?('Fondo de '+S.fund.months+' meses · '+ROLE_TXT[ME.role]+(S.fund.closed?' · cerrado':'')):ROLE_TXT[ME.role];
  $('#demoWho').hidden=PROD; $('#prodWho').hidden=!PROD; $('#meName').textContent=ME.name+' · '+ROLE_TXT[ME.role];
  if(!PROD) $('#userSel').innerHTML=S.members.map(function(m){ return '<option value="'+m.id+'"'+(m.id===ui.userId?' selected':'')+'>'+esc(m.name)+' ('+ROLE_TXT[m.role].toLowerCase()+')</option>'; }).join('');
  if(!S.fund){ $('#tabs').innerHTML=''; $('#view').innerHTML=viewNoFund(); Array.prototype.forEach.call(document.querySelectorAll('#view form'), function(fm){ fm.noValidate=true; }); showOnly('app'); return; }
  var tabs=[['resumen','Resumen'],['aportes',staff?'Aportes':'Mis aportes'],['prestamos',staff?'Préstamos':'Mis préstamos']];
  if(staff) tabs.push(['liquidacion','Liquidación']);
  tabs.push(['estado','Estado de cuenta']);
  if(staff) tabs.push(['socios','Socios']);
  if(admin) tabs.push(['ajustes','Reglas']);
  if(staff) tabs.push(['actividad','Actividad']);
  if(!tabs.some(function(t){ return t[0]===ui.tab; })) ui.tab='resumen';
  var pc=S.contributions.filter(function(c){ return c.status==='revision'; }).length;
  var pl=S.payments.filter(function(p){ return p.status==='revision'; }).length+S.loans.filter(function(l){ return l.status==='solicitado'; }).length;
  $('#tabs').innerHTML=tabs.map(function(t){
    var b=''; if(admin&&t[0]==='aportes'&&pc) b='<span class="badge">'+pc+'</span>'; if(admin&&t[0]==='prestamos'&&pl) b='<span class="badge">'+pl+'</span>'; if(admin&&t[0]==='socios'&&pendingProfiles().length) b='<span class="badge">'+pendingProfiles().length+'</span>';
    return '<button type="button" data-act="tab" data-tab="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+b+'</button>';
  }).join('');
  var v={resumen:viewResumen,aportes:viewAportes,prestamos:viewPrestamos,liquidacion:viewLiquidacion,estado:viewEstado,socios:viewSocios,ajustes:viewAjustes,actividad:viewActividad}[ui.tab];
  $('#view').innerHTML=v();
  Array.prototype.forEach.call(document.querySelectorAll('#view form'), function(fm){ fm.noValidate=true; });
  showOnly('app');
}

var F={};
function loginError(e){
  var m=String((e&&e.message)||e||''), code=(e&&e.code)||'', st=e&&e.status;
  if(/not confirmed|email_not_confirmed/i.test(m+code)) return 'Tu correo aún no está confirmado. En Supabase, Authentication > Users, abre tu usuario y confirma el correo (o créalo de nuevo marcando Auto Confirm User).';
  if(/invalid login credentials|invalid_credentials/i.test(m+code)) return 'Correo o contraseña incorrectos. Si estás seguro de que son los correctos, revisa en Supabase (Authentication > Users) que el usuario exista y esté confirmado.';
  if(/api key|apikey|invalid jwt|No API key/i.test(m)) return 'La clave de config.js no es válida. Cópiala de nuevo desde Supabase (Project Settings > API Keys), completa y sin espacios.';
  if(/signups? not allowed|signup is disabled|signups are disabled/i.test(m)) return 'Los registros nuevos están desactivados en Supabase. Actívalos en Authentication > Sign In / Providers > Allow new users to sign up.';
  if(/database error saving new user/i.test(m)) return 'No se pudo crear tu cuenta (error de base de datos). Avisa al administrador.';
  if(/redirect_uri|redirect url|not allowed/i.test(m)) return 'La dirección de regreso no está permitida. En Supabase, Authentication > URL Configuration, agrega la dirección de esta página.';
  if(/invalid path specified/i.test(m)) return 'La URL de config.js está mal escrita. Debe ser solo https://TU-PROYECTO.supabase.co, sin "/" al final y sin nada después.';
  if(/failed to fetch|networkerror|load failed|fetch/i.test(m)) return 'No se pudo conectar con Supabase. Revisa la URL de config.js (debe empezar con https:// y terminar en .supabase.co) y tu internet.';
  if(/rate limit|too many/i.test(m)) return 'Demasiados intentos. Espera unos minutos y vuelve a intentar.';
  return 'No se pudo ingresar: '+m+(st?' (código '+st+')':'');
}
F.login=function(){
  var email=($('#lg-email').value||'').trim(), pass=$('#lg-pass').value;
  if(!email||!pass) return ferr('Escribe tu correo y tu contraseña.');
  return sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){
    if(r.error) throw r.error;
    return loadAll();
  }).then(function(){ $('#lg-pass').value=''; render(); }).catch(function(e){ ferr(loginError(e)); });
};

  var a=Number($('#l-amount').value), n=Number($('#l-term').value);
  if(!(a>=10000)) return ferr('Ingresa un monto de al menos $10.000.');
  if(!(n>=1)) return ferr('El plazo debe ser de al menos 1 mes.');

  return done(api.requestLoan(who, a, n, ($('#l-note').value||'').trim()));

  return prepareEvidence($('#f-file').files[0]).then(function(ev){ return api.submitPayment(f.dataset.id, a, ev, note.trim()); }).then(function(){ closeModal(); render(); }).catch(function(e){ ferr(e.message); });
};
F['approve-pay']=function(f){ return done(api.reviewPayment(f.dataset.id,true,Number($('#p-int').value),'')); };
F['reject-pay']=function(f){
  var n=($('#f-note').value||'').trim(); if(!n) return ferr('Escribe el motivo del rechazo.');
  return done(api.reviewPayment(f.dataset.id,false,0,n));
};
F['new-member']=function(){
  var o={phone:($('#m-phone').value||'').trim(), role:$('#m-role').value, modality:$('#m-mod').value};
  if(PROD){ o.profileId=$('#m-profile').value; }
  else {
    o.name=($('#m-name').value||'').trim(); o.email=($('#m-email').value||'').trim();
    if(!o.name) return ferr('Escribe el nombre del socio.');
    if(!/^\S+@\S+\.\S+$/.test(o.email)) return ferr('Escribe un correo válido.');
  }
  return done(api.addMember(o));
};
F.settings=function(){
  var o={name:($('#s-name').value||'').trim(), rate:Number($('#s-rate').value)/100, maxLoanAmount:Number($('#s-maxamt').value), maxActiveLoans:Number($('#s-maxl').value),
         lateFee:Number($('#s-fee').value), graceDays:Number($('#s-grace').value), reservePct:Number($('#s-res').value)/100, interestMode:$('#s-mode').value};
  if(!o.name) return ferr('El fondo necesita un nombre.');
  if(!(o.rate>=0&&o.rate<=0.2)) return ferr('La tasa debe estar entre 0% y 20%.');
  if(!(o.maxLoanAmount>=10000)||!(o.maxActiveLoans>=1)) return ferr('Revisa el valor máximo del préstamo (mínimo $10.000) y el máximo de préstamos vigentes.');
  if(!(o.lateFee>=0)||!(o.graceDays>=0)) return ferr('La multa y los días de gracia no pueden ser negativos.');
  if(!(o.reservePct>=0&&o.reservePct<=0.9)) return ferr('La reserva debe estar entre 0% y 90%.');
  return api.saveSettings(o).then(function(){ render(); var e=visFerr(); if(e){ e.style.color='var(--good)'; e.textContent='Cambios guardados.'; } }).catch(function(e){ ferr(e.message); });
};
F['create-fund']=function(){
  var o={name:($('#n-name').value||'').trim(), startDate:$('#n-start').value, months:Number($('#n-months').value), monthlyAmt:Number($('#n-mon').value), biweeklyAmt:Number($('#n-bi').value), rate:Number($('#n-rate').value)/100};
  if(!o.name||!o.startDate) return ferr('Escribe el nombre y la fecha de inicio.');
  if(!(o.months>=1&&o.months<=36)) return ferr('La duración debe estar entre 1 y 36 meses.');
  if(!(o.monthlyAmt>0)||!(o.biweeklyAmt>0)) return ferr('Los aportes deben ser mayores que cero.');
  return done(api.createFund(o));
};

/* ---------- eventos ---------- */
document.addEventListener('click', function(e){
  var t=e.target.closest('[data-act]');
  if(t){ if(H[t.dataset.act]) H[t.dataset.act](t.dataset); return; }
  if(e.target.id==='modal') closeModal();
});
document.addEventListener('submit', function(e){
  e.preventDefault();
  var f=e.target, fn=f.dataset.form&&F[f.dataset.form]; if(!fn) return;
  var btn=f.querySelector('button[type=submit]'); if(btn) btn.disabled=true;
  Promise.resolve().then(function(){ return fn(f); }).catch(function(err){ ferr(err.message||String(err)); }).then(function(){ if(btn) btn.disabled=false; });
});
document.addEventListener('change', function(e){
  var b=e.target.dataset&&e.target.dataset.bind;
  if(e.target.id==='p-type'){ payTypeChange(); return; }
  if(b){ ui[b]=e.target.value; if(b==='userId') setMe(); render(); return; }
  if(e.target.classList&&e.target.classList.contains('cb-c')) batchTotal();
});
document.addEventListener('input', function(e){
  if(e.target.id==='l-amount'||e.target.id==='l-term') loanPreview();
  if(e.target.id==='p-int') capPreview();
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

/* =====================================================================
   INICIO
   ===================================================================== */
function oauthErrorFromUrl(){
  try{
    var q=new URLSearchParams(location.search), h=new URLSearchParams(location.hash.replace(/^#/,''));
    var d=q.get('error_description')||h.get('error_description');
    if(d){ history.replaceState(null,'',location.pathname); return d; }
  }catch(e){}
  return null;
}
async function start(){
  try{ if('serviceWorker' in navigator && location.protocol.indexOf('http')===0) navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
  if(PROD){
    if(!sb){ showMsg('No se pudo cargar la librería de Supabase. Revisa tu conexión a internet y recarga la página.'); return; }
    sb.auth.onAuthStateChange(function(ev){ if(ev==='SIGNED_OUT'){ ME=null; showOnly('login'); } });
    var oerr=oauthErrorFromUrl();
    var ses=(await sb.auth.getSession()).data.session;
    if(!ses){ showOnly('login'); if(oerr) ferr(loginError(new Error(oerr))); return; }
    try{ await loadAll(); render(); }catch(e){ showMsg('No se pudieron cargar los datos: '+e.message); }
    return;
  }
  await demoApi.init(); render();
}
start();
})();
</script>
